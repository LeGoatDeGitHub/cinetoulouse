name: Synchroniser la programmation CinéToulouse

on:
  schedule:
    - cron: '15 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-program
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Scrape Toulouse cinemas & enrich Letterboxd
        run: bun run sync

      - name: Commit updated static program
        run: |
          if git diff --quiet public/data/program.json && [ -z "$(git ls-files --others --exclude-standard public/data/program.json)" ]; then
            echo "Aucun changement dans public/data/program.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/program.json
          git commit -m "chore: mise à jour quotidienne de la programmation CinéToulouse"
          git push
